<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixie Shop KG</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #1a1a1a;
            color: white;
            margin: 0;
            padding: 20px;
        }
        h1 { text-align: center; color: #f39c12; font-size: 24px; border-bottom: 2px solid #333; padding-bottom: 10px; }
        .catalog { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .card {
            background: #262626;
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            border: 1px solid #333;
        }
        .card img { width: 100%; border-radius: 8px; margin-bottom: 10px; }
        .card .title { font-weight: bold; font-size: 14px; height: 40px; overflow: hidden; }
        .card .price { color: #2ecc71; margin: 10px 0; font-size: 16px; }
        .btn {
            background: #f39c12;
            color: black;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>
    <h1>🚲 FIXIE SHOP KG</h1>
    <div class="catalog" id="catalog">
        <p style="grid-column: 1/3; text-align: center; color: #888;">Загрузка актуальных товаров...</p>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); // Развернуть на весь экран

        // Тестовая функция закрытия
        function buyItem(name) {
            tg.sendData("Купить: " + name);
            tg.close();
        }
    </script>
</body>
</html>
