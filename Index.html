<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gixedgear Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Основные цвета в стиле Fixie-культуры */
        :root {
            --bg: #0a0a0a;
            --card: #161616;
            --accent: #f39c12; /* Золото */
            --text: #ffffff;
            --muted: #888888;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* Шапка приложения */
        .header {
            padding: 25px 15px;
            text-align: center;
            background: linear-gradient(to bottom, #1a1a1a, var(--bg));
            border-bottom: 1px solid #222;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--accent);
            text-shadow: 0 0 10px rgba(243, 156, 18, 0.3);
        }

        .header p {
            margin: 8px 0 0;
            font-size: 12px;
            color: var(--muted);
            font-weight: 300;
        }

        /* Сетка товаров */
        .container {
            padding: 15px;
        }

        .catalog {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        /* Карточка товара */
        .card {
            background: var(--card);
            border-radius: 16px;
            border: 1px solid #252525;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.1s;
        }

        .card:active {
            transform: scale(0.96);
        }

        .card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            background-color: #222;
        }

        .card-info {
            padding: 12px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            height: 38px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .price {
            font-size: 16px;
            font-weight: 800;
            color: var(--accent);
            margin-bottom: 12px;
        }

        /* Кнопка купить */
        .buy-btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 10px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 11px;
            text-transform: uppercase;
            cursor: pointer;
            width: 100%;
        }

        #loader {
            text-align: center;
            padding: 40px;
            color: var(--muted);
        }
    </style>
</head>
<body>

<div class="header">
    <h1>GIXEDGEAR KG</h1>
    <p>МАГАЗИН ФИКСИРОВАННЫХ ВЕЛОСИПЕДОВ</p>
</div>

<div class="container">
    <div id="loader">Загрузка каталога...</div>
    <div class="catalog" id="catalog"></div>
</div>

<script>
    let tg = window.Telegram.WebApp;
    tg.expand(); // Разворачиваем приложение
    tg.ready();

    // Тестовые данные (пока ты на Pydroid)
    const mockItems = [
        {
            title: "Tsunami SNM100 Black",
            price: "19 500 сом",
            photo: "https://images.unsplash.com/photo-1532298229144-0ee0c57515c5?w=500"
        },
        {
            title: "Aventon Mataro Raw",
            price: "52 000 сом",
            photo: "https://images.unsplash.com/photo-1507035895480-2b3156c31fc8?w=500"
        },
        {
            title: "Колеса Miche Pistard",
            price: "24 000 сом",
            photo: "https://images.unsplash.com/photo-1485965120184-e220f721d03e?w=500"
        },
        {
            title: "Система Sram Omnium",
            price: "18 000 сом",
            photo: "https://images.unsplash.com/photo-1544191713-2945d8120e8b?w=500"
        }
    ];

    function render() {
        const container = document.getElementById('catalog');
        const loader = document.getElementById('loader');
        
        container.innerHTML = '';
        
        mockItems.forEach(item => {
            const el = document.createElement('div');
            el.className = 'card';
            el.innerHTML = `
                <img src="${item.photo}" alt="">
                <div class="card-info">
                    <div class="title">${item.title}</div>
                    <div class="price">${item.price}</div>
                    <button class="buy-btn" onclick="sendOrder('${item.title}')">🛒 Заказать</button>
                </div>
            `;
            container.appendChild(el);
        });

        loader.style.display = 'none';
    }

    function sendOrder(name) {
        tg.sendData("Хочу купить: " + name);
        tg.close(); // Закрыть Mini App после заказа
    }

    // Имитация загрузки
    setTimeout(render, 500);

</script>
</body>
</html>
